[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "financial-research-assistant"
version = "0.1.0"
description = "LangGraph financial research assistant over read-only IBKR MCP market-data tools, with a Textual chat TUI, headless CLI, and offline eval harness"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=1.0,<2.0",
    "langgraph-checkpoint-sqlite>=2.0",
    "langchain>=1.0,<2.0",
    "langchain-openai>=1.0",
    "langchain-mcp-adapters>=0.1",
    # `langchain-mcp-adapters` only asks for `mcp>=1.9.2`, so a fresh resolve
    # picks up mcp 2.x — which moved `RequestContext` out of
    # `mcp.shared.context` and breaks the adapter on import, taking the whole
    # live broker MCP session down with it. uv.lock already held this at 1.28.1,
    # so locked installs were fine and a plain `pip install .` was not; the
    # bound makes both agree. Lift it once the adapter supports mcp 2.x.
    "mcp>=1.9.2,<2.0",
    "textual>=1.0",
    "python-dotenv>=1.0",
    "plotext>=5.2",
    "ddgs>=9.0",
    "yfinance>=0.2.40",
    "numpy>=1.24",
    # `typing_extensions.override` — `typing.override` is 3.12+ and this package
    # supports 3.10. Already present transitively (pydantic/langchain); declared
    # here because the package imports it directly.
    "typing-extensions>=4.4",
    # Report rendering (`render_report`). Both are pip-only wheels with no system
    # libraries: fpdf2 writes the PDF when no browser is installed — the case in
    # this project's own container — and pypdfium2 rasterises page 1 for the cover
    # image, which a page-less screenshot cannot express. Small next to pandas and
    # langchain, and the feature is bound into the tool catalog rather than
    # optional, so they are core rather than an extra.
    "fpdf2>=2.8",
    "pypdfium2>=4.0",
    # IANA zone data for `zoneinfo`. Scheduled reports are pinned to
    # America/New_York so they follow the US close whatever zone the host runs
    # in, and a slim container image (or Windows) has no system zone database
    # for `zoneinfo` to read — it falls back to this package.
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]
# Optional OpenTelemetry export (Langfuse / LangSmith / Phoenix / any OTLP
# collector). Enable at runtime with AGENT_TRACING=1 or OTEL_EXPORTER_OTLP_*.
tracing = [
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
]
# Non-OpenAI model providers (select with MODEL_PROVIDER). Each pulls the
# LangChain integration package init_chat_model needs for that provider.
anthropic = ["langchain-anthropic>=1.0"]
google = ["langchain-google-genai>=2.0"]
groq = ["langchain-groq>=1.0"]
# Cross-broker statement import: parse OFX/QFX exports (Vanguard, E*TRADE,
# Schwab, most banks) alongside the built-in IBKR CSV importer. Off by default;
# `import_ibkr_statement` returns a friendly install hint when absent.
ofx = ["ofxtools>=0.9"]
# Document-upload RAG PDF support: `ingest_document` reads .txt/.md/.html without
# this; the extra adds PDF text extraction. `ingest_document` returns a friendly
# install hint when a PDF is given and pypdf is absent.
documents = ["pypdf>=4.0"]

[project.scripts]
financial-research-assistant = "financial_research_assistant.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/financial_research_assistant"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

# Type checking: `uvx pyright`, `uvx basedpyright`, or the editor's Pylance over
# the package. The tree is clean under all three at this setting — the few
# genuinely-unknowable spots carry a narrow `# pyright: ignore[...]` naming the
# reason, so a new diagnostic is a real signal rather than noise to scroll past.
#
# basedpyright defaults to its `recommended` mode, which is stricter than pyright
# and turns on ~3000 diagnostics here. Everything below is switched off
# deliberately and for a stated reason; every rule NOT listed stays on, so a new
# rule in a future release surfaces rather than being silently swallowed.
#
# It all lives in one `[tool.pyright]` block on purpose. basedpyright REPLACES
# this section with `[tool.basedpyright]` rather than merging the two, so
# splitting the basedpyright-only rules out would mean duplicating `include` /
# `venv` / every other rule and letting the copies drift. The cost is that plain
# pyright prints "unrecognized setting" for the three rules it doesn't have
# (reportAny, reportExplicitAny, reportUnannotatedClassAttribute) — informational
# only; it still reports 0 errors.
[tool.pyright]
include = ["src/financial_research_assistant"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.10"
# Bare `dict` / `set` / `tuple` say nothing about their contents; the editor
# flags them by default, so match that here rather than have the two disagree.
reportMissingTypeArgument = "error"

# --- Untyped third-party surface ---------------------------------------------
# yfinance, ddgs, plotext, mcp and much of langchain ship no (or partial) types,
# so every value crossing those boundaries is Unknown and every annotation we
# write to contain it is an explicit `Any`. Silencing these is not a statement
# that the code is well-typed there — it is that the fix lives in stub files for
# other people's packages, not in this tree. The boundaries are narrow and each
# one is guarded at runtime (`_num`, `getattr(..., default)`, `try/except`).
reportAny = "none"
reportExplicitAny = "none"
reportUnknownArgumentType = "none"
reportUnknownLambdaType = "none"
reportUnknownMemberType = "none"
reportUnknownParameterType = "none"
reportUnknownVariableType = "none"
reportMissingTypeStubs = "none"

# --- Style mandates, not defects ---------------------------------------------
# Discarding a return value (`log.write(...)`, `set_interval(...)`) is ordinary
# here, long prompt strings are built with implicit concatenation on purpose, and
# a declarative class body (`BINDINGS`, `AUTH_URL`, `DOTS`) reads better without
# a type on every line.
reportUnusedCallResult = "none"
reportImplicitStringConcatenation = "none"
reportUnannotatedClassAttribute = "none"
# Only fires on `frozenset()` defaults, which are immutable — the mutable-default
# footgun this rule exists to catch does not occur in this tree.
reportCallInDefaultInitializer = "none"

# --- Deliberate architecture -------------------------------------------------
# `_name` marks "not part of the PACKAGE's public API"; sibling modules inside
# the package share those helpers by design, and the test suite monkeypatches
# them by that exact name (`tools._fetch_daily`, `tools._ibkr_server_config`).
reportPrivateUsage = "none"
# On, so a NEW accidental cycle is an error. The few that remain are each
# deliberate and suppressed at the top of the file that starts the chain, with the
# reason stated there: `__init__.py` (the `from . import x` idiom, which is an edge
# to the package itself), `brokers.py` (the late-bound broker registry), and
# `catalog.py` (a subagent's tool pool is by definition the catalog).
reportImportCycles = "error"
